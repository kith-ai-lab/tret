services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tret
      POSTGRES_PASSWORD: tret
      POSTGRES_DB: tret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tret"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    # Root context, not ./backend: the image also carries the repository's docs/
    # so GET /api/docs can serve the emissions methodology to the in-product
    # dialog (backend/tret/api/docs.py). The root .dockerignore keeps the wider
    # context from dragging .venv / node_modules into the build.
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TRET_DATABASE_URL: postgresql+asyncpg://tret:tret@postgres:5432/tret
      TRET_SECRET_KEY: ${TRET_SECRET_KEY:-dev-secret-change-me}
      TRET_ADMIN_EMAIL: ${TRET_ADMIN_EMAIL:-admin@example.com}
      TRET_ADMIN_PASSWORD: ${TRET_ADMIN_PASSWORD:-tret-admin}
      TRET_STORAGE_DIR: /data/storage
      TRET_PACKS_DIR: /packs
      TRET_ANTHROPIC_API_KEY: ${TRET_ANTHROPIC_API_KEY:-}
      TRET_MOONSHOT_API_KEY: ${TRET_MOONSHOT_API_KEY:-}
      TRET_OPENROUTER_API_KEY: ${TRET_OPENROUTER_API_KEY:-}
      TRET_ROUTER_MODEL: ${TRET_ROUTER_MODEL:-anthropic/claude-haiku-4-5}
      TRET_ROUTER_TIMEOUT_SECONDS: ${TRET_ROUTER_TIMEOUT_SECONDS:-10.0}
      # `tret run`'s local ledger. Empty means ~/.tret/ledger.jsonl — meaningless
      # inside this container (the CLI is a bare-metal / bind-mount workflow),
      # kept wired anyway so the knob is never silently ignored.
      TRET_LEDGER_PATH: ${TRET_LEDGER_PATH:-}
      # Every knob .env.example documents has to be listed here or it does not
      # reach the container: compose reads .env only to interpolate ${...}, and
      # nothing copies .env into the image. tests/test_compose_env.py asserts
      # this block stays in step with .env.example and with the code defaults, so
      # a documented setting can never again be silently ignored.
      #
      # The `:-<default>` values are deliberate rather than empty: an unset knob
      # would otherwise arrive as an empty string, and "" is not a valid int,
      # float or bool, so the backend would refuse to boot.
      TRET_OPENROUTER_CATALOG: ${TRET_OPENROUTER_CATALOG:-true}
      # Attribution headers OpenRouter shows on its dashboard. Overridable here
      # so a fork or a private deployment is not announcing this repo's URL.
      TRET_OPENROUTER_REFERER: ${TRET_OPENROUTER_REFERER:-https://github.com/tret-platform/tret}
      TRET_OPENROUTER_TITLE: ${TRET_OPENROUTER_TITLE:-tret}
      # Raw JSON `provider` object merged into every OpenRouter request; blank
      # (the default) reads as "not set" rather than a JSON parse error.
      TRET_OPENROUTER_PROVIDER_PREFS: ${TRET_OPENROUTER_PROVIDER_PREFS:-}
      TRET_ROUTER_COOLDOWN_MINUTES: ${TRET_ROUTER_COOLDOWN_MINUTES:-30.0}
      TRET_ROUTER_NEW_MODEL_SLOTS: ${TRET_ROUTER_NEW_MODEL_SLOTS:-3}
      TRET_ROUTER_NEW_MODEL_WINDOW_DAYS: ${TRET_ROUTER_NEW_MODEL_WINDOW_DAYS:-60}
      TRET_LOGIN_MAX_ATTEMPTS: ${TRET_LOGIN_MAX_ATTEMPTS:-10}
      TRET_LOGIN_WINDOW_SECONDS: ${TRET_LOGIN_WINDOW_SECONDS:-300.0}
      TRET_METHODS_NETWORK_ISOLATION: ${TRET_METHODS_NETWORK_ISOLATION:-true}
      # ── outbound network (docs/hardening.md §9, tret/net/) ──────────────
      # Five switchable classes: provider, catalog, local, research, search.
      # TRET_EGRESS=off is the air-gapped deployment: no cloud provider, no
      # catalog, no web — a local model server still works, provided it
      # really is on a private address.
      TRET_EGRESS: ${TRET_EGRESS:-on}
      TRET_EGRESS_PROVIDER: ${TRET_EGRESS_PROVIDER:-on}
      TRET_EGRESS_CATALOG: ${TRET_EGRESS_CATALOG:-on}
      TRET_EGRESS_LOCAL: ${TRET_EGRESS_LOCAL:-on}
      # Web search and page fetch. OFF by default — it is the one class whose
      # destination a model chooses. `replay` reads only pages already
      # snapshotted, which is how a benchmark or an audit re-runs offline.
      TRET_EGRESS_RESEARCH: ${TRET_EGRESS_RESEARCH:-off}
      # Empty means the public web. Set it to make research a real allowlist.
      TRET_EGRESS_RESEARCH_ALLOW_HOSTS: ${TRET_EGRESS_RESEARCH_ALLOW_HOSTS:-}
      TRET_EGRESS_RESEARCH_MAX_BYTES: ${TRET_EGRESS_RESEARCH_MAX_BYTES:-2000000}
      TRET_EGRESS_RESEARCH_TIMEOUT_SECONDS: ${TRET_EGRESS_RESEARCH_TIMEOUT_SECONDS:-20.0}
      TRET_EGRESS_RESEARCH_MAX_FETCHES_PER_RUN: ${TRET_EGRESS_RESEARCH_MAX_FETCHES_PER_RUN:-10}
      # Per-run budgets for the connected-source tools (list_connected_sources /
      # search_connected_files / read_connected_file), which read live from a
      # workspace's linked SharePoint/OneDrive. Separate from the research
      # limits above — a connected read uses the workspace's own OAuth grant,
      # not a model-chosen URL — but still needs a per-run ceiling.
      TRET_CONNECTIONS_MAX_READS_PER_RUN: ${TRET_CONNECTIONS_MAX_READS_PER_RUN:-20}
      TRET_CONNECTIONS_MAX_BYTES_PER_RUN: ${TRET_CONNECTIONS_MAX_BYTES_PER_RUN:-104857600}
      TRET_CONNECTIONS_MAX_SEARCHES_PER_RUN: ${TRET_CONNECTIONS_MAX_SEARCHES_PER_RUN:-30}
      # An app-level allowlist is a deterrent; a proxy the workload cannot
      # bypass is a boundary. Point this at yours for anything internet-facing.
      TRET_EGRESS_PROXY: ${TRET_EGRESS_PROXY:-}
      # Opt-in anonymous telemetry (docs/telemetry.md). admin (default) leaves
      # it to the instance admin, off-by-default until they opt in from the
      # UI/CLI; off locks it off; on is for a headless install. DO_NOT_TRACK
      # (read from the process environment, not a TRET_ var — see
      # docs/telemetry.md) beats whatever this says.
      TRET_TELEMETRY: ${TRET_TELEMETRY:-admin}
      TRET_TELEMETRY_URL: ${TRET_TELEMETRY_URL:-https://telemetry.kithailab.com/v1/report}
      # The ambient convention every tool checks the same way — no TRET_
      # prefix, read straight from the process environment (docs/telemetry.md)
      # — beats whatever TRET_TELEMETRY says. Not wired, it never reaches the
      # container at all, since compose interpolates .env into this block and
      # nothing else copies it in.
      DO_NOT_TRACK: ${DO_NOT_TRACK:-}
      # Web search backend: "" (none) | brave | searxng. searxng keeps the query
      # itself inside your network.
      TRET_SEARCH_PROVIDER: ${TRET_SEARCH_PROVIDER:-}
      TRET_SEARCH_API_KEY: ${TRET_SEARCH_API_KEY:-}
      TRET_SEARXNG_BASE_URL: ${TRET_SEARXNG_BASE_URL:-}
      TRET_LOCAL_DISPLAY_NAME: ${TRET_LOCAL_DISPLAY_NAME:-Local}
      TRET_LOCAL_PROBE_TOOLS: ${TRET_LOCAL_PROBE_TOOLS:-true}
      # Measure a local run's own energy instead of pricing it from tokens —
      # off (default) | nvidia_smi. See docs/emissions-methodology.md.
      # nvidia_smi needs the NVIDIA Container Toolkit installed on the host
      # AND a `deploy.resources.reservations.devices` entry (or `runtime:
      # nvidia`) on the backend service below so this container can see the
      # GPU at all — without one, `nvidia-smi` is simply not there, and the
      # meter falls back to the per-token estimate with a single log line
      # rather than failing the run.
      TRET_LOCAL_ENERGY_METER: ${TRET_LOCAL_ENERGY_METER:-off}
      TRET_LOCAL_ENERGY_METER_INTERVAL_S: ${TRET_LOCAL_ENERGY_METER_INTERVAL_S:-1.0}
      TRET_LOCAL_ENERGY_METER_GPU_INDEX: ${TRET_LOCAL_ENERGY_METER_GPU_INDEX:-}
      # Eco accounting — docs/eco-accounting.md, docs/emissions-methodology.md.
      # Omitted when unset so the application retains its cited Ember default
      # provenance. Set TRET_GRID_CO2E_G_PER_KWH to supply an operator factor.
      TRET_GRID_CO2E_G_PER_KWH:
      # GHG Protocol Scope 2 basis of that factor: location_based | market_based
      # | unspecified. The default factor is a physical-grid average.
      TRET_GRID_CO2E_BASIS: ${TRET_GRID_CO2E_BASIS:-location_based}
      # Per-provider grid factors, as JSON keyed by provider name. Blank means
      # none configured. Quote it in .env, single quotes and no spaces around the
      # JSON, e.g.
      #   TRET_GRID_FACTORS={"local":{"g_per_kwh":42,"basis":"location_based"}}
      # Operator configuration only — tret never infers a region from an IP and
      # makes no network call to resolve a factor.
      TRET_GRID_FACTORS: ${TRET_GRID_FACTORS:-}
      # Blank on purpose: unset means "use TRET_GRID_CO2E_G_PER_KWH for local
      # inference too". A number here would silently defeat that fallback. Legacy
      # but still honoured — TRET_GRID_FACTORS["local"] supersedes it.
      TRET_LOCAL_GRID_CO2E_G_PER_KWH: ${TRET_LOCAL_GRID_CO2E_G_PER_KWH:-}
      TRET_LOCAL_GRID_CO2E_BASIS: ${TRET_LOCAL_GRID_CO2E_BASIS:-unspecified}
      TRET_DATACENTER_PUE: ${TRET_DATACENTER_PUE:-1.2}
      TRET_LOCAL_PUE: ${TRET_LOCAL_PUE:-1.05}
      # Uptime Institute 2024 industry average, for self-hosting in a real
      # machine room rather than on a desk.
      TRET_ONPREM_PUE: ${TRET_ONPREM_PUE:-1.56}
      TRET_LOCAL_DEPLOYMENT_PROFILE: ${TRET_LOCAL_DEPLOYMENT_PROFILE:-workstation}
      TRET_EMBODIED_G_PER_RUN: ${TRET_EMBODIED_G_PER_RUN:-0.0}
      # Multiplicative judgment band (central/2.5 .. central x 2.5), NOT a
      # confidence interval.
      TRET_UNCERTAINTY_BAND_LOW: ${TRET_UNCERTAINTY_BAND_LOW:-2.5}
      TRET_UNCERTAINTY_BAND_HIGH: ${TRET_UNCERTAINTY_BAND_HIGH:-2.5}
      TRET_EMISSIONS_BASELINE_MODEL: ${TRET_EMISSIONS_BASELINE_MODEL:-}
      # Local inference server (Ollama, LM Studio, vLLM, llama.cpp), for running
      # with no cloud provider at all — docs/local-models.md. From inside this
      # container your host's server is NOT localhost: use
      # TRET_LOCAL_BASE_URL=http://host.docker.internal:11434/v1 (the
      # extra_hosts entry below makes that name resolve on Linux too).
      #
      # Using the bundled `local` profile below instead? Put
      # TRET_LOCAL_BASE_URL=http://ollama:11434/v1 in .env. It stays .env-driven
      # on purpose: hard-wiring the ollama URL here would make tret report
      # local as configured even when the profile is off, i.e. permanently
      # configured-but-down.
      TRET_LOCAL_BASE_URL: ${TRET_LOCAL_BASE_URL:-}
      TRET_LOCAL_API_KEY: ${TRET_LOCAL_API_KEY:-}
      # This file is the local quickstart, so it defaults to development mode:
      # plain HTTP on localhost and the shipped default secret/password, so
      # `docker compose up` just works. Do not expose it to a network as-is.
      #
      # For a real deployment, put these in .env — with production set, tret
      # refuses to boot while the shipped default secret key or admin password
      # is still in place, rather than running insecurely (docs/hardening.md).
      # Terminate TLS in front of it; cookie_secure keeps the session cookie off
      # plain HTTP. Neither line needs editing here:
      #   TRET_ENVIRONMENT=production
      #   TRET_COOKIE_SECURE=true
      #   TRET_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
      #   TRET_ADMIN_PASSWORD=<strong password>
      TRET_ENVIRONMENT: ${TRET_ENVIRONMENT:-development}
      TRET_COOKIE_SECURE: ${TRET_COOKIE_SECURE:-false}
      # Skip the boot-time `alembic upgrade head`. Leave false unless you run
      # migrations as a separate deploy step — tret then assumes the database
      # is already at head (docs/upgrading.md).
      TRET_SKIP_MIGRATIONS: ${TRET_SKIP_MIGRATIONS:-false}
      # Single-instance enforcement (docs/hardening.md): a Postgres advisory
      # lock at boot, held for the process lifetime, since the run event bus
      # is in-process. The lock connection also gets aggressive TCP keepalive
      # tuning so a crashed prior holder is reaped in well under a minute.
      # warn (default) logs and keeps booting if another instance holds it;
      # strict refuses to boot; off skips the check.
      TRET_INSTANCE_LOCK: ${TRET_INSTANCE_LOCK:-warn}
      # How long a losing process retries before deciding the lock is
      # genuinely held rather than a deploy handover's old machine finishing
      # up. 90s covers a normal handover plus the keepalive reaping above.
      TRET_INSTANCE_LOCK_WAIT_SECONDS: ${TRET_INSTANCE_LOCK_WAIT_SECONDS:-90.0}
      TRET_SHUTDOWN_DRAIN_SECONDS: ${TRET_SHUTDOWN_DRAIN_SECONDS:-45.0}
      # Multi-tenant SaaS mode (tret_cloud). false is every self-hosted
      # deployment: one workspace, no personal-workspace-per-user seeding.
      TRET_MULTI_TENANT: ${TRET_MULTI_TENANT:-false}
      # Whether every new workspace gets every pack in TRET_PACKS_DIR
      # installed. true (the default) ships the flagship pack(s) into every
      # workspace regardless of TRET_MULTI_TENANT.
      TRET_SEED_DEFAULT_PACKS: ${TRET_SEED_DEFAULT_PACKS:-true}
      # Pack marketplace registry (Find/Install, tret/api/packs.py's
      # /api/packs/registry/* — the RUN path never reads this). OPT-IN: unset
      # (the default) means the Find tab and update badges degrade to a
      # friendly empty state and tret makes zero marketplace network calls.
      # Set to Kith's hosted registry (https://cloud.tret.kithailab.com/api/marketplace)
      # or a private mirror to enable Find/Install.
      TRET_PACK_REGISTRY_URL: ${TRET_PACK_REGISTRY_URL:-}
      # Cap on team workspaces one user may own via POST /api/workspaces.
      # 0 (the default) is unlimited.
      TRET_MAX_TEAM_WORKSPACES_PER_USER: ${TRET_MAX_TEAM_WORKSPACES_PER_USER:-0}
      # Delegation width and the database pool it leans on (see .env.example).
      TRET_MAX_FANOUT: ${TRET_MAX_FANOUT:-4}
      TRET_MAX_CHILDREN_PER_RUN: ${TRET_MAX_CHILDREN_PER_RUN:-8}
      TRET_MAX_CONCURRENT_CHILD_RUNS: ${TRET_MAX_CONCURRENT_CHILD_RUNS:-6}
      TRET_DELEGATION_TIMEOUT_SECONDS: ${TRET_DELEGATION_TIMEOUT_SECONDS:-900}
      TRET_DB_POOL_SIZE: ${TRET_DB_POOL_SIZE:-10}
      TRET_DB_MAX_OVERFLOW: ${TRET_DB_MAX_OVERFLOW:-10}
      # Single sign-on (generic OIDC, tret/api/oidc.py). password is every
      # self-hosted deployment; the OIDC router only mounts once
      # TRET_OIDC_ISSUER is also set.
      TRET_AUTH_MODE: ${TRET_AUTH_MODE:-password}
      TRET_OIDC_ISSUER: ${TRET_OIDC_ISSUER:-}
      TRET_OIDC_CLIENT_ID: ${TRET_OIDC_CLIENT_ID:-}
      TRET_OIDC_CLIENT_SECRET: ${TRET_OIDC_CLIENT_SECRET:-}
      TRET_OIDC_REDIRECT_URL: ${TRET_OIDC_REDIRECT_URL:-}
      TRET_OIDC_LOGOUT_URL: ${TRET_OIDC_LOGOUT_URL:-}
      # Who a fresh OIDC sign-in may create an account for, comma-separated
      # email domains. Empty (the default) means no domain restriction of
      # its own — a self-hosted, non-multi-tenant deployment still falls
      # back to requiring an invitation in that case.
      TRET_OIDC_ALLOWED_EMAIL_DOMAINS: ${TRET_OIDC_ALLOWED_EMAIL_DOMAINS:-}
      # A second, opt-in way into the API: an OIDC access token as
      # `Authorization: Bearer <jwt>` (tret/api/oidc_bearer.py). Empty (the
      # default) is the entire switch — bearer auth is off.
      TRET_OIDC_API_AUDIENCE: ${TRET_OIDC_API_AUDIENCE:-}
      TRET_OIDC_ROLES_CLAIM: ${TRET_OIDC_ROLES_CLAIM:-}
      TRET_OIDC_ADMIN_ROLE: ${TRET_OIDC_ADMIN_ROLE:-}
      # Which clients may mint a bearer token this API accepts, comma-separated
      # client ids (checked against `azp`, falling back to `client_id`). Empty
      # (the default) means trusting every client your IdP tenant authorized
      # for the API audience above, not just the one you intend.
      TRET_OIDC_BEARER_CLIENT_IDS: ${TRET_OIDC_BEARER_CLIENT_IDS:-}
      # This deployment's own public base URL — used only to build an invite
      # link that gets emailed out, never to reach anything.
      TRET_APP_URL: ${TRET_APP_URL:-http://localhost:8000}
      # Invite email. off is every self-hosted deployment: the invite API
      # still works with nothing set here — it always returns the invite
      # link itself, so copy-link never depends on this.
      TRET_EMAIL_MODE: ${TRET_EMAIL_MODE:-off}
      TRET_RESEND_API_KEY: ${TRET_RESEND_API_KEY:-}
      TRET_EMAIL_FROM: ${TRET_EMAIL_FROM:-}
      TRET_SMTP_HOST: ${TRET_SMTP_HOST:-}
      TRET_SMTP_PORT: ${TRET_SMTP_PORT:-587}
      TRET_SMTP_USERNAME: ${TRET_SMTP_USERNAME:-}
      TRET_SMTP_PASSWORD: ${TRET_SMTP_PASSWORD:-}
      TRET_SMTP_TLS: ${TRET_SMTP_TLS:-true}
      # In-process extension modules, comma-separated dotted module names.
      # Empty (the default here) is what this image ships: the extension seam
      # in tret/engine/extensions.py is entirely inert.
      TRET_EXTENSIONS: ${TRET_EXTENSIONS:-}
      # Workspace connections (Google Drive / Microsoft 365 OAuth,
      # tret/services/connections.py, tret/api/connections.py). All blank by
      # default — every self-hosted deployment ships with connections
      # unconfigured until an operator registers OAuth apps with Google/
      # Microsoft and sets these.
      TRET_GDRIVE_CLIENT_ID: ${TRET_GDRIVE_CLIENT_ID:-}
      TRET_GDRIVE_CLIENT_SECRET: ${TRET_GDRIVE_CLIENT_SECRET:-}
      TRET_M365_CLIENT_ID: ${TRET_M365_CLIENT_ID:-}
      TRET_M365_CLIENT_SECRET: ${TRET_M365_CLIENT_SECRET:-}
      # Google Picker developer key + Cloud project number, handed to the
      # frontend picker verbatim. Blank hides the in-app picker even with a
      # gdrive client configured.
      TRET_GDRIVE_PICKER_API_KEY: ${TRET_GDRIVE_PICKER_API_KEY:-}
      TRET_GDRIVE_APP_ID: ${TRET_GDRIVE_APP_ID:-}
    volumes:
      - ./packs:/packs:ro
      - storage:/data/storage
    # So TRET_LOCAL_BASE_URL can reach a model server running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5180:80"

  # ── bundled local model server (opt-in) ────────────────────────────────────
  # `docker compose --profile local up` adds an Ollama server and pulls one
  # tool-capable model into it, so tret can run with no cloud key and no manual
  # install. Set TRET_LOCAL_BASE_URL=http://ollama:11434/v1 in .env to use it.
  #
  # Set expectations before you start it:
  #   - the first start downloads multi-GB model weights (a few GB, once —
  #     they persist in the `ollama` volume, not in the image);
  #   - inference here is CPU-only. Docker Desktop passes no GPU through on
  #     macOS, so on Apple Silicon a NATIVE `brew install ollama` is several
  #     times faster and is the recommended path (docs/local-models.md);
  #   - this profile is the zero-manual-steps path, not the fastest one.
  ollama:
    # Pinned rather than `latest` so a fleet upgrade is a deliberate diff, not
    # whatever shipped the day someone next pulls. 0.33.2 was current stable
    # (== `latest`'s own digest, checked against Docker Hub) as of this pin;
    # bump deliberately, not by dropping back to `latest`.
    image: ollama/ollama:0.33.2
    profiles: ["local"]
    volumes:
      # Named volume: pulled weights survive `docker compose down`.
      - ollama:/root/.ollama
    # Reachable as http://ollama:11434 on the compose network only — no host
    # port is published, since tret is the only thing that needs to talk to it.
    expose:
      - "11434"
    restart: unless-stopped

  # One-shot: waits for the server, pulls the default model, exits. Idempotent —
  # a model already in the volume re-downloads nothing, so re-running the profile
  # is cheap. Pick a different model with TRET_LOCAL_PULL_MODEL in .env.
  ollama-init:
    # Same pin as the `ollama` service above — this just needs the `ollama`
    # CLI, but a mismatched version here would still be its own drift.
    image: ollama/ollama:0.33.2
    profiles: ["local"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      PULL_MODEL: ${TRET_LOCAL_PULL_MODEL:-qwen2.5:7b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes compose interpolation: the shell expands these, not compose.
    command:
      - |
        echo "waiting for ollama at $$OLLAMA_HOST ..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "pulling $$PULL_MODEL (multi-GB on first run; cached afterwards) ..."
        ollama pull "$$PULL_MODEL"
        echo "done: $$(ollama list)"
    restart: "no"

  # ── bundled SearXNG search backend (opt-in) ────────────────────────────────
  # `docker compose --profile search up` adds a self-hosted metasearch instance
  # so `web_search` works with no hosted API key and the query itself never
  # leaves your network. Set TRET_SEARCH_PROVIDER=searxng and
  # TRET_SEARXNG_BASE_URL=http://searxng:8080 in .env to use it.
  #
  # These calls ride the `search` egress class (tret/net/policy.py,
  # docs/hardening.md §9), not `research`: the backend's URL is something the
  # operator named here, never something a model chooses, so it gets that
  # class's allow-one-host trust instead of research's SSRF checks — which is
  # exactly what lets an internal, unauthenticated, plain-http address like
  # this one work at all.
  #
  # secret_key (signs SearXNG's own session data, ./searxng/settings.yml):
  # the searxng/searxng image has no env var for this, and only ever writes a
  # random secret itself when NO settings.yml exists yet at its config path —
  # checked against its actual entrypoint.sh, which this repo's own
  # settings.yml (needed for the JSON API and limiter=false) would otherwise
  # permanently short-circuit, shipping the placeholder in that file
  # byte-for-byte. `entrypoint:` below overrides the image's own entrypoint
  # with a small wrapper (./searxng/inject-secret-entrypoint.sh) that
  # resolves a real secret — SEARXNG_SECRET if set, else one generated on
  # first boot and persisted in the bind-mounted `.secret` dir so it survives
  # restarts — substitutes it into a copy of settings.yml at the image's real
  # config path, and only then hands off to the image's own entrypoint.
  searxng:
    # Pinned rather than `latest` for the same reason as `ollama` above.
    # 2026.9.3-a1144dda3 was current stable (== `latest`'s own digest,
    # checked against Docker Hub) as of this pin.
    image: searxng/searxng:2026.9.3-a1144dda3
    profiles: ["search"]
    entrypoint: ["/searxng-src/inject-secret-entrypoint.sh"]
    environment:
      # Set your own to pin the secret explicitly (e.g. shared across a
      # multi-environment setup); leave unset and the wrapper above generates
      # and persists one on first boot. See .env.example.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      # Read-only source for the wrapper to copy from — never SearXNG's own
      # config path, so the secret it substitutes never gets written back
      # into this repo's checked-in settings.yml.
      - ./searxng:/searxng-src:ro
      # Where the wrapper persists a generated secret across restarts/recreates.
      - ./searxng/.secret:/run/searxng-secret
    # No published port: internal network only. The backend reaches it as
    # http://searxng:8080 over the compose network — nothing else needs to,
    # and this service must never be exposed to a network beyond that (it runs
    # with its rate limiter off, see ./searxng/settings.yml).
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  ollama:
