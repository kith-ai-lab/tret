# The deployed Fly app predates the tret rename and Fly apps cannot be
# renamed — "kith-bench" is the app's immutable name, not stale config.
app = "kith-bench"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  TRET_PACKS_DIR = "/packs"
  TRET_STORAGE_DIR = "/data/storage"
  TRET_SERVE_FRONTEND_DIR = "/app/frontend-dist"
  # A real deployment, declared as one: the boot checks refuse to start with the
  # shipped dev secret or admin password (docs/hardening.md). Set both as Fly
  # secrets before the first deploy — see docs/deploy-fly.md.
  TRET_ENVIRONMENT = "production"
  # force_https is on above, so the session cookie can be TLS-only.
  TRET_COOKIE_SECURE = "true"
  TRET_ROUTER_MODEL = "openrouter/openai/gpt-5.6-luna"

[http_service]
  internal_port = 8000
  force_https = true
  # Single always-on machine: the run event bus is in-process and SSE streams
  # are long-lived. Do NOT scale horizontally without the LISTEN/NOTIFY bus.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/healthz"

[mounts]
  source = "tret_storage"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
