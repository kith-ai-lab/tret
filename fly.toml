app = "kith-bench"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  BENCH_PACKS_DIR = "/packs"
  BENCH_STORAGE_DIR = "/data/storage"
  BENCH_SERVE_FRONTEND_DIR = "/app/frontend-dist"
  BENCH_COOKIE_SECURE = "true"
  BENCH_ROUTER_MODEL = "openrouter/openai/gpt-4.1"

[http_service]
  internal_port = 8000
  force_https = true
  # Single always-on machine: the run event bus is in-process and SSE streams
  # are long-lived. Do NOT scale horizontally without the LISTEN/NOTIFY bus.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/healthz"

[mounts]
  source = "bench_storage"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
