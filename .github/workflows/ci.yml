name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        # -c constraints.txt pins every dependency pip resolves here — direct and
        # transitive — to the exact versions tret is tested against, so this
        # step installs the same thing today and a year from now instead of
        # "whatever currently satisfies pyproject.toml's >= ranges." See
        # constraints.txt's own header for why this is a plain pip constraints
        # file rather than a new lockfile tool, and how to regenerate it.
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Lint
        working-directory: backend
        # Tests are linted too: the eval suite is production-grade code.
        run: ruff check tret tests
      - name: Test
        working-directory: backend
        # Includes tests/evals — the golden runs are a build gate, not a
        # separate opt-in suite (docs/evals.md). Live evals stay skipped.
        run: pytest -q
      - name: Single migration head
        working-directory: backend
        # Two heads merge cleanly in git and then fail on deploy.
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::expected exactly 1 Alembic head, found $heads"
            exit 1
          fi
      - name: Validate climate pack
        working-directory: backend
        # Also runs the method safety scan and prints the integrity hash.
        run: |
          python -m tret.cli packs validate ../packs/climate-risk
          python -m tret.cli packs hash ../packs/climate-risk

  # The schema lifecycle, against a real Postgres. The `backend` job above runs
  # everything on sqlite/in-process fakes, which is exactly why it stayed green
  # while upgrades were broken: `create_all` builds a correct schema from
  # nothing, so a fresh CI database can never reveal a missing migration or a
  # legacy database that no migration ever adopted. This job is the one that can.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tret
          POSTGRES_PASSWORD: tret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tret"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: tret
      # tests/test_migrations_postgres.py creates and drops a throwaway database
      # per test; this URL is only the maintenance connection.
      TRET_TEST_POSTGRES_URL: postgresql+asyncpg://tret:tret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        # Same pinned install as the backend job, and for the same reason: a
        # schema-lifecycle run against a real Postgres is exactly the job that
        # must not flake because a transitive dependency moved underneath it.
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Schema lifecycle (empty, legacy, drift, downgrade, app boot)
        working-directory: backend
        # Asserts, per its module docstring: empty -> head builds the schema;
        # **Alembic autogenerate produces an EMPTY diff against Base.metadata**
        # (models-vs-migrations drift — the root-cause check); an unstamped
        # create_all database is classified, stamped and upgraded with its rows
        # intact; downgrade -1 then upgrade works; and the real FastAPI lifespan
        # boots against both an empty and a legacy database.
        run: pytest tests/test_migrations_postgres.py -q
      - name: alembic CLI upgrade head on an empty database
        working-directory: backend
        # The path a deployer follows by hand, and the one env.py's async engine
        # branch serves. Kept separate from the tests above, which drive Alembic
        # through its Python API on a connection the app already owns.
        env:
          TRET_DATABASE_URL: postgresql+asyncpg://tret:tret@localhost:5432/tret_cli
        run: |
          psql -h localhost -U tret -d postgres -c 'CREATE DATABASE tret_cli'
          alembic upgrade head
          alembic current | tee /tmp/current.txt
          grep -q "$(alembic heads | awk '{print $1}') (head)" /tmp/current.txt
      - name: Downgrade to base and back up
        working-directory: backend
        # Proves every downgrade() is real, not just the last one.
        env:
          TRET_DATABASE_URL: postgresql+asyncpg://tret:tret@localhost:5432/tret_cli
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic current

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        # npm ci installs exactly what package-lock.json resolved (and refuses to
        # run if it and package.json have drifted), unlike npm install, which is
        # free to re-resolve within the package.json ranges and can install a
        # different tree than what was last committed.
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  # The TypeScript SDK (sdk/typescript). Its request/response types are
  # generated from a committed OpenAPI snapshot, so this job also proves the
  # snapshot is current: it re-dumps the schema from the backend (no database
  # needed, see backend/scripts/dump_openapi.py), regenerates the types, and
  # fails on any diff. A backend change that moves the API surface has to
  # move the snapshot and the SDK in the same commit.
  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[server]" -c constraints.txt
      - name: Install
        working-directory: sdk/typescript
        run: npm ci
      - name: OpenAPI snapshot and generated types are current
        run: |
          python backend/scripts/dump_openapi.py sdk/typescript/openapi.json
          (cd sdk/typescript && npm run generate)
          if ! git diff --exit-code -- sdk/typescript/openapi.json sdk/typescript/src/generated; then
            echo "::error::sdk/typescript/openapi.json or src/generated is stale: run python backend/scripts/dump_openapi.py sdk/typescript/openapi.json && (cd sdk/typescript && npm run generate), then commit"
            exit 1
          fi
      - name: Typecheck
        working-directory: sdk/typescript
        run: npm run typecheck
      - name: Test
        working-directory: sdk/typescript
        # Includes the check that the SDK's run-event union names exactly the
        # events backend/tret publishes.
        run: npm test
      - name: Build
        working-directory: sdk/typescript
        run: npm run build

  # /api/healthz only proves the process is up — it says nothing about whether
  # the seeded pack actually installed or the app can serve an authenticated
  # request. A bootstrap that silently drops the pack (a bad path, a validation
  # error swallowed at startup) used to leave this job green. It now logs in
  # with the shipped dev admin, and asserts on what login unlocks: the
  # climate-risk pack present with its task types, and at least one seeded
  # harness — the two things docs/demo-script.md promises a fresh
  # `docker compose up` gives you.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot stack
        run: |
          cp .env.example .env
          docker compose up --build -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/healthz && exit 0
            sleep 2
          done
          echo "::error::backend never reported healthy"
          docker compose logs backend
          exit 1
      - name: Verify the seeded pack installed and the app is functional
        run: |
          set -e
          login_status=$(curl -sS -o /tmp/login.json -w '%{http_code}' \
            -c /tmp/cookies.txt -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"tret-admin"}' \
            http://localhost:8000/api/auth/login)
          if [ "$login_status" != "200" ]; then
            echo "::error::admin login failed (HTTP $login_status) — the seeded admin user is missing or bootstrap did not run"
            cat /tmp/login.json
            docker compose logs backend
            exit 1
          fi

          # printf '%s', not echo "$var": these bodies are arbitrary JSON, and
          # `echo` on some shells interprets backslash escapes inside a quoted
          # variable (e.g. a literal `\n` in a pack description), corrupting the
          # payload before jq ever sees it. printf never does that.
          packs=$(curl -sSf -b /tmp/cookies.txt http://localhost:8000/api/packs)
          printf '%s' "$packs" | jq -e '[.[] | select(.slug == "climate-risk")] | length == 1' > /dev/null || {
            echo "::error::the climate-risk pack is not installed — GET /api/packs did not return it"
            printf '%s\n' "$packs"
            docker compose logs backend
            exit 1
          }
          printf '%s' "$packs" | jq -e '[.[] | select(.slug == "climate-risk")][0].task_types | length > 0' > /dev/null || {
            echo "::error::climate-risk pack installed with zero task types — bootstrap ran but the pack is broken"
            printf '%s\n' "$packs"
            exit 1
          }

          harnesses=$(curl -sSf -b /tmp/cookies.txt http://localhost:8000/api/harnesses)
          printf '%s' "$harnesses" | jq -e 'length > 0' > /dev/null || {
            echo "::error::no harnesses were seeded — the app booted but the demo bootstrap did not complete"
            printf '%s\n' "$harnesses"
            docker compose logs backend
            exit 1
          }
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
