name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check bench
      - name: Test
        working-directory: backend
        run: pytest -q
      - name: Validate climate pack
        working-directory: backend
        run: python -m bench.cli packs validate ../packs/climate-risk

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot stack
        run: |
          cp .env.example .env
          docker compose up --build -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/healthz && exit 0
            sleep 2
          done
          docker compose logs backend
          exit 1
