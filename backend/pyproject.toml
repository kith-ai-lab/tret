[project]
name = "tret"
version = "0.2.0"
description = "An open-source AI harness platform for non-technical knowledge work"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # <1: anthropic 1.x is a new client generation (httpx2 transport, a
    # reworked call surface) that this codebase has not been ported to —
    # letting the floor drift past 0.x silently pulls in a client our provider
    # code does not speak. Pin the exact version in constraints.txt; widen
    # this floor only alongside an actual 1.x migration.
    "anthropic>=0.117,<1",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    # Kept in core deliberately: the headless CLI (tret run) reads local PDFs/docx.
    "pypdf>=4.2",
    "python-docx>=1.1",
    # xlsx/pptx extraction (services/documents.py) — mainly for files imported
    # from SharePoint/OneDrive, which speak these formats natively.
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
    "weasyprint>=62",
    # Generic OIDC login (tret/api/oidc.py) — deliberately never an Auth0 SDK,
    # so any spec-compliant issuer works.
    "authlib>=1.3",
]
# Object-storage backend (TRET_STORAGE_BACKEND=s3, docs/storage.md). Optional:
# the default local backend never imports boto3.
s3 = [
    "boto3>=1.34",
]
dev = [
    "tret[server]",
    "tret[s3]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # Per-test time limit (`timeout` under [tool.pytest.ini_options]).
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "aiosqlite>=0.20",
    # Mocks the httpx calls tret/api/oidc.py makes to an OIDC issuer
    # (discovery, JWKS, token exchange) in tests/test_oidc_login.py.
    "respx>=0.21",
]

[project.scripts]
tret = "tret.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tret"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A hung or busy-looping test must end the run, not run until the machine runs
# out of memory. Each test, fixtures included, gets `timeout` seconds; then the
# whole run stops with exit code 1 and prints every thread's stack, so the
# frame stuck in the loop is in the output. `thread` rather than the default
# `signal` method: a signal-raised failure that lands in a background asyncio
# task only ends that task, and the test goes on to pass, hiding the bug.
# `--timeout=0` turns it off for one run (e.g. under a debugger).
timeout = 120
timeout_method = "thread"
markers = [
    "live: eval that calls a real model over the network; skipped unless TRET_LIVE_EVALS=1",
]
