# Curated model catalog. `id` is the bench-wide model id (provider-prefixed);
# `wire_id` is what gets sent to the provider's API. Static entries here always
# win over dynamically fetched OpenRouter catalog entries.
#
# Prices are USD per million tokens and drive run cost accounting — keep them
# roughly current; they are estimates, not billing.
models:
