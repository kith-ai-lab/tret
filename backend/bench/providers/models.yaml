    provider: anthropic
    wire_id: claude-fable-5
    display_name: Claude Fable 5
    released: 2026-06
    context_window: 1000000
    input_price_per_mtok: 10.0
    output_price_per_mtok: 50.0
    cost_tier: premium
    energy_class: XL
    strengths: [deep reasoning, doctrine-following, long-form drafting, hardest verdicts]
