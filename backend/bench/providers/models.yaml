# Curated model catalog. `id` is the bench-wide model id (provider-prefixed);
# `wire_id` is what gets sent to the provider's API. Static entries here always
# win over dynamically fetched OpenRouter catalog entries.
#
# Prices are USD per million tokens and drive run cost accounting — keep them
# roughly current; they are estimates, not billing. `released` (YYYY-MM) feeds
# the router's prefer-newer rule. Verified against the live OpenRouter catalog
# 2026-07.
#
# ── energy_class: HEURISTIC ESTIMATES, NOT MEASUREMENTS ───────────────────────
# No provider publishes per-model energy draw, and inference energy depends on
# hardware, batching, and datacentre efficiency that bench cannot see. So each
# model gets an order-of-magnitude bucket, converted to Wh per million tokens
# processed in providers/catalog.py (ENERGY_CLASS_WH_PER_MTOK):
#
#   S  ≈   50 Wh/Mtok  small / distilled / quantized weights, incl. local models
#   M  ≈  300 Wh/Mtok  mid-size served models — the anchor: ~0.3 Wh for a ~1k
#                      token prompt, the order of magnitude large operators have
#                      published for a median text prompt
#   L  ≈ 1200 Wh/Mtok  large frontier models
#   XL ≈ 3000 Wh/Mtok  largest frontier / heavy-reasoning models
#
# Classes here are assigned from public model-scale signals (parameter counts
# where known, price and latency as proxies otherwise). They are good enough to
# compare two candidate models by roughly how much energy they burn, and NOT
# good enough to report as an emissions figure of record. A model may override
# the class default with an explicit `energy_wh_per_mtok`. Reasoning and limits:
# docs/eco-accounting.md.
models:
