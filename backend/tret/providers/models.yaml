# Curated model catalog. `id` is the tret-wide model id (provider-prefixed);
# `wire_id` is what gets sent to the provider's API. Static entries here always
# win over dynamically fetched OpenRouter catalog entries.
#
# Prices are USD per million tokens and drive run cost accounting — keep them
# roughly current; they are estimates, not billing. `released` (YYYY-MM) feeds
# the router's prefer-newer rule. Verified against the live OpenRouter catalog
# 2026-07, and again 2026-09 for the entries added that month (see their
# individual source comments).
#
# ── optional cost-model fields (all default to "none of this applies") ───────
# cache_read_multiplier / cache_write_multiplier: override the module defaults
#   (0.1x / 1.25x of input price) for a model whose provider prices its cache
#   differently — e.g. claude-fable-5-1's 0.025x cache reads and
#   claude-opus-5-5's 0.05x cache reads.
# pricing_tiers: a list of {above_prompt_tokens, input_multiplier,
#   output_multiplier} steps. Above the threshold the *whole* request (not
#   just the excess) bills at the multiplied rate — GPT-6 Astra doubles
#   input/cache and adds 50% to output once the prompt passes 272K tokens.
#   Thresholds must be strictly ascending and multipliers must be positive.
# price_changes: a list of {effective: "YYYY-MM-DD", input_price_per_mtok,
#   output_price_per_mtok}, sorted ascending by effective date. The
#   input_price_per_mtok/output_price_per_mtok keys above are always the
#   model's base price — this schedule never overwrites them. ModelInfo.
#   prices_at() (which cost_usd calls fresh on every invocation, using
#   today's date) resolves whichever entry is due as of a given date, so a
#   long-running process bills a scheduled change correctly the day it takes
#   effect, with no restart (e.g. gemini-3.8-flash's introductory rate
#   through 2026, then the higher standard rate from 2027-01-01). Each
#   entry's prices must be positive, and must keep the model inside its
#   declared cost_tier band (checked against _tier_from_price) — a change
#   that would silently cross a tier boundary fails the whole catalog load.
# supports_effort: does this model's provider API accept a reasoning-effort
#   control at all? Verified 2026-09-10 against
#   https://platform.claude.com/docs/en/build-with-claude/effort (Anthropic's
#   `output_config.effort`, supported models listed by name) and
#   https://openrouter.ai/docs/guides/best-practices/reasoning-tokens plus the
#   live https://openrouter.ai/api/v1/models `supported_parameters` per entry
#   (OpenRouter's unified `reasoning.effort`). True only where one of those two
#   sources explicitly confirms it — see each entry's own comment below.
#
# ── energy_class: CALIBRATED ESTIMATES, STILL NOT MEASUREMENTS ────────────────
# Each class is Wh per million **output-equivalent** tokens (an output token
# counts 1.0, an input token 0.05, a cache write 0.05, a cache read 0.005 —
# generation costs ~20x reading per token). The constants live in
# tret/services/emissions.py (ENERGY_CLASS_WH_PER_MTOK) and are least-squares
# source-PUE-normalized fixed-weight fits against Jegham et al.,
# arXiv:2505.09598v1 (14 May 2025):
#
#   S  = 210.3398 Wh/Mtok fitted from GPT-4.1 nano. Small / distilled
#                        / nano-class served models, and the default for local
#                        weights.
#   M  = 855.6651 Wh/Mtok fitted from GPT-4o. Mid-size served models.
#   L  = 2399.3371 Wh/Mtok fitted from Claude 3.7 Sonnet. Large
#                        frontier models.
#   XL = 6727.8875 Wh/Mtok NO measured anchor — reproducible L²/M interpolation. The
#                        largest non-reasoning flagships.
#   R  = 17713.3258 Wh/Mtok fitted from source-PUE-normalized o3 observations.
#                         The reasoning tier; its reasoning-token denominator
#                         remains an explicit calibration uncertainty.
#
# HOW TO READ AN ASSIGNMENT BELOW. Active parameter counts are unpublished for
# every closed model here, so **tier and price remain a proxy for size** and that
# proxy is imperfect: a lab's margin, its context length and its serving
# hardware all move price without moving energy. Worse, price does not predict
# the reasoning tier in either direction — in the reference dataset DeepSeek-R1
# is among the two heaviest models measured *and* among the cheapest on the
# market. So class R is assigned from what a model does, never from what it
# costs, and every assignment below carries its reasoning inline.
#
# The documented upgrade path is EcoLogits' active-parameter formula (published
# fitted constants α=1.17e-6, β=-1.12e-2, γ=4.05e-5; linear in active params with
# exponential decay in batch size, default batch 64). tret does not implement it
# because it would be fed a guessed parameter count, but the seam is ready:
# `active_params_b` (billions of active parameters per forward pass — for a
# mixture-of-experts model, the active subset, not the total) is now a legal
# field on any entry below (ModelInfo validates it positive and finite when
# present) but is read by nothing yet — a later phase's energy strategy will
# teach emissions.wh_per_mtok_for_model to prefer it over energy_class when
# set. A model may also override its class outright with an explicit
# `energy_wh_per_mtok` — do that if you have metered your own deployment.
# Limits: docs/emissions-methodology.md.
models:
