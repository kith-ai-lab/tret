# Minimal SearXNG config for the bundled `search` compose profile
# (docker-compose.yml, service `searxng`). Bind-mounted read-only as the
# *source* for that service's entrypoint wrapper (./inject-secret-entrypoint.sh),
# which copies it to /etc/searxng/settings.yml with a real secret_key
# substituted for the placeholder below — never edited or used in place.
#
# This instance is internal-only (docs/hardening.md §9, tret/net/policy.py
# CLASS_SEARCH): the backend reaches it at http://searxng:8080 on the compose
# network, no port is published, and tret trusts this exact operator-configured
# host without the SSRF checks it applies to a model-chosen URL. That trust is
# only sound as long as this container is never reachable from anywhere else —
# see the `searxng` service's comment in docker-compose.yml.
use_default_settings: true

server:
  # Signs SearXNG's own session data. Neither SearXNG nor Compose expands a
  # `${VAR:-default}` form written *inside* this file, and the searxng/searxng
  # image's own entrypoint has no SEARXNG_SECRET env var at all (verified
  # against its actual entrypoint.sh: it only ever writes a random secret when
  # no settings.yml exists yet at the mount, which is never true once this
  # file is copied in). So this placeholder is never what SearXNG actually
  # runs with: the `searxng` service's entrypoint wrapper
  # (./inject-secret-entrypoint.sh) substitutes a real secret in on every
  # boot before SearXNG ever reads this file — generated once and persisted
  # (or set explicitly via SEARXNG_SECRET), never this literal string. See
  # the searxng service in docker-compose.yml.
  secret_key: "change-me-searxng"
  # Deliberately off: SearXNG's limiter is aimed at a metasearch instance
  # exposed to the public internet (bot/scrape throttling). This instance has
  # no exposed port and no client but tret's backend, so the limiter would only
  # add a way for a burst of `web_search` calls in one run to start failing
  # against nothing. Do not flip this on without also publishing the service to
  # a wider network — the two decisions go together.
  limiter: false

search:
  # ESSENTIAL: without `json` here, SearXNG's search endpoint answers a
  # `format=json` request with 403 Forbidden — its JSON API is opt-in per
  # instance, not implied by asking for it in the query string. This is the
  # single most common misconfiguration when standing up SearXNG behind an
  # API-consuming client (tret/net/search/searxng.py requests `format: json`).
  formats:
    - html
    - json
