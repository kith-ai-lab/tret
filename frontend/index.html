<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tret</title>
    <script>
      // Applied before first paint so a stored dark preference never flashes
      // light. Absent/invalid storage falls through to the light default set
      // in global.css — no attribute needed for that case.
      (function () {
        try {
          var t = localStorage.getItem('tret-theme')
          if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
