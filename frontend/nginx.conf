server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default body limit is 1 MB, which 413s every document upload before
    # the backend sees it. The largest body the API legitimately accepts is a
    # multipart document upload: MAX_DOCUMENT_BYTES = 25 MiB in
    # backend/tret/services/documents.py (also the provider-import and chat
    # attachment cap) plus a 64 KiB multipart allowance in api/documents.py. The
    # other upload paths are smaller (pack archives 10 MiB, api/packs.py and
    # packs/archive.py; pack-builder drafts 10 MiB; emissions settings 3 MiB).
    # Dataset imports (services/dataset_import.py, 50 MiB) are reached through
    # the agent's tools, not an upload endpoint, so they do not set this.
    # 26m sits just over the 25 MiB cap so the backend, which returns the
    # descriptive 413, is what refuses an oversized file. If MAX_DOCUMENT_BYTES
    # is raised, raise this with it.
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SSE support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Security response headers for the SPA and its static assets — mirrors
    # tret/main.py's SecurityHeadersMiddleware, which covers the same four
    # headers for the single-app Fly deployment path that serves the built
    # frontend straight from the backend instead of through nginx. Scoped to
    # this location only (not the server block, and not /api/ above): those
    # requests proxy straight to the backend, which already sets its own copy
    # — adding them here too would just duplicate them on every API response.
    #
    # script-src's hash is frontend/index.html's one inline script (the
    # dark-mode pre-paint check) rather than 'unsafe-inline' — see the longer
    # comment in tret/main.py. If that script's contents ever change,
    # recompute the hash and update it in both places, or the SPA's dark-mode
    # preload is silently blocked (degraded, not broken — see main.py).
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-t9DNwLQDLCEhXVRmNTkJe02dNWmqy1VO8ME4IVgsRDk=' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://content.googleapis.com https://docs.google.com; frame-src 'self' blob: https://docs.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
